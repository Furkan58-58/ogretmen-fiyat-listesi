name: Fiyat listesini yayınla
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
